# 处置强度标记的语法位置(评审 P1-4: 对主之/宜/可与/与/属建立更严格的语法识别)
# 后置: "X主之";前置: "宜X/可与X/与X/属X";否定前置: "不可与X"
strength_markers:
  positive_after: [主之]
  positive_before: [可与, 宜, 与, 属]
  negative: [不可与, 不可服, 不可发汗, 不可下, 不可吐, 禁]

# 治法禁忌(无方剂宾语): "不可发汗/不可下/不可吐"
therapy_contraindications: [不可发汗, 不可下, 不可吐]

# 指代禁忌(回指前一分支主方): "不可服之/不可与之/不可更服"
referential_contraindications: [不可服, 不可与之, 不可更服]

# 误治/先行处置标志(mistreatment 前置条件)
prior_treatment_markers:
  - 医反下之
  - 反二三下之
  - 反下之
  - 下之后
  - 发汗后
  - 病发汗
  - 发汗过多
  - 服桂枝汤
  - 大汗出后
  - 发汗,遂
  - 若下之

# 分支逻辑标志
branch_markers: [若, 或, 但, 反, 更, 复, 已后]
